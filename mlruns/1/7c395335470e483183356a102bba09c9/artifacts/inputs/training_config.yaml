random_seed: 42

baseline:
  logistic_regression:
    class_weight: balanced
    max_iter: 500
    solver: lbfgs

  random_forest:
    n_estimators: 80
    max_depth: 18
    min_samples_leaf: 2
    class_weight: balanced_subsample
    n_jobs: 1

  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: hist
    n_jobs: 1

  hist_gradient_boosting:
    max_iter: 200
    learning_rate: 0.1
    max_leaf_nodes: 31
    class_weight: balanced