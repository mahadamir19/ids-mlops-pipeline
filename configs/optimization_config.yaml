objective_metric: pr_auc
direction: maximize

sampler:
  name: TPESampler
  seed: 42

pruner:
  name: MedianPruner
  n_startup_trials: 1
  n_warmup_steps: 20
  interval_steps: 10

modes:
  smoke:
    train_sample_size: 20000
    validation_sample_size: 10000
  full:
    train_sample_size: null
    validation_sample_size: null

models:
  logistic_regression:
    enabled: true
    smoke_trials: 2
    full_trials: 6
    pruning_enabled: false
    pruning_strategy: unsupported
    search_space:
      C:
        type: float
        low: 0.001
        high: 10.0
        log: true
      penalty:
        type: categorical
        choices: [l2]
      solver:
        type: categorical
        choices: [lbfgs, liblinear]
      max_iter:
        type: int
        low: 300
        high: 800
        step: 100

  random_forest:
    enabled: true
    smoke_trials: 2
    full_trials: 8
    pruning_enabled: false
    pruning_strategy: unsupported
    search_space:
      n_estimators:
        type: int
        low: 40
        high: 160
        step: 20
      max_depth:
        type: int
        low: 8
        high: 28
        step: 2
      min_samples_split:
        type: int
        low: 2
        high: 10
      min_samples_leaf:
        type: int
        low: 1
        high: 6
      max_features:
        type: categorical
        choices: [sqrt, log2]
      class_weight:
        type: categorical
        choices: [balanced, balanced_subsample]

  xgboost:
    enabled: true
    smoke_trials: 2
    full_trials: 12
    pruning_enabled: true
    pruning_strategy: MedianPruner + XGBoostPruningCallback
    search_space:
      n_estimators:
        type: int
        low: 80
        high: 320
        step: 40
      max_depth:
        type: int
        low: 3
        high: 10
      learning_rate:
        type: float
        low: 0.02
        high: 0.2
        log: true
      subsample:
        type: float
        low: 0.6
        high: 1.0
      colsample_bytree:
        type: float
        low: 0.6
        high: 1.0
      min_child_weight:
        type: float
        low: 1.0
        high: 8.0
      reg_alpha:
        type: float
        low: 0.000001
        high: 1.0
        log: true
      reg_lambda:
        type: float
        low: 0.1
        high: 5.0
        log: true

  hist_gradient_boosting:
    enabled: true
    smoke_trials: 2
    full_trials: 8
    pruning_enabled: false
    pruning_strategy: unsupported
    search_space:
      max_iter:
        type: int
        low: 80
        high: 320
        step: 40
      learning_rate:
        type: float
        low: 0.02
        high: 0.2
        log: true
      max_leaf_nodes:
        type: int
        low: 15
        high: 63
        step: 4
      max_depth:
        type: int
        low: 3
        high: 16
      min_samples_leaf:
        type: int
        low: 10
        high: 80
        step: 10
      l2_regularization:
        type: float
        low: 0.000001
        high: 5.0
        log: true
