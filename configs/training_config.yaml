random_seed: 42

baseline:
  logistic_regression:
    C: 1.0
    penalty: l2
    solver: lbfgs
    class_weight: balanced
    max_iter: 500

  random_forest:
    n_estimators: 80
    max_depth: 18
    min_samples_split: 2
    min_samples_leaf: 2
    max_features: sqrt
    class_weight: balanced_subsample
    n_jobs: 1

  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: hist
    device: cpu
    n_jobs: 1

  hist_gradient_boosting:
    max_iter: 200
    learning_rate: 0.1
    max_leaf_nodes: 31
    max_depth: null
    min_samples_leaf: 20
    l2_regularization: 0.0
    class_weight: balanced
