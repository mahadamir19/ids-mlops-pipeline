global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sentinelml-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: sentinelml-monitor
    metrics_path: /metrics
    static_configs:
      - targets:
          - monitor:9101

  - job_name: sentinelml-resilience
    metrics_path: /metrics
    static_configs:
      - targets:
          - resilience:9201
