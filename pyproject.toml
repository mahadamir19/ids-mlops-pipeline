[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelml"
version = "0.1.0"
description = "SentinelML intrusion-detection MLOps lifecycle platform."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sentinelml = "sentinelml.cli:main"

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "httpx>=0.28",
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]
mlflow-runtime = [
    "boto3>=1.34",
    "mlflow>=2.14",
    "psycopg2-binary>=2.9",
]
api-runtime = [
    "boto3>=1.34",
    "fastapi>=0.141",
    "mlflow>=2.14",
    "numpy>=1.26",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "pydantic>=2.13",
    "PyYAML>=6.0",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "uvicorn>=0.52",
    "xgboost>=2.0",
]
retrainer-runtime = [
    "boto3>=1.34",
    "dvc>=3.50",
    "fastapi>=0.141",
    "joblib>=1.4",
    "mlflow>=2.14",
    "numpy>=1.26",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "pyarrow>=15.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "uvicorn>=0.52",
    "xgboost>=2.0",
]
ml = [
    "joblib>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
]
gpu = [
    "cupy-cuda12x>=14.1",
    "nvidia-cuda-nvcc-cu12>=12.9",
    "nvidia-cuda-nvrtc-cu12>=12.9",
    "nvidia-cuda-runtime-cu12>=12.9",
]
tracking = [
    "boto3>=1.34",
    "dvc>=3.50",
    "mlflow>=2.14",
    "optuna>=4.0",
    "optuna-integration[xgboost]>=4.0",
    "psycopg2-binary>=2.9",
]
serving = [
    "fastapi>=0.141",
    "pydantic>=2.13",
    "PyYAML>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.52",
]
simulation = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "PyYAML>=6.0",
]
monitoring = [
    "evidently==0.7.21",
    "fastapi>=0.141",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "pyarrow>=15.0",
    "PyYAML>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.52",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "I001", "B905"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    ".venv/*",
    "tests/*",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
